name: Deploy Supabase Migrations

on:
  push:
    branches:
      - master
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --dns-resolver https
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Repair migration history for consolidated schema
        run: |
          # Mark all old migrations as reverted since we consolidated into a single migration
          supabase migration repair --status reverted 20241221000000 || true
          supabase migration repair --status reverted 20241221000001 || true
          supabase migration repair --status reverted 20241221000002 || true
          supabase migration repair --status reverted 20241221000003 || true
          supabase migration repair --status reverted 20241222000003 || true
          supabase migration repair --status reverted 20241222000004 || true
          supabase migration repair --status reverted 20241222000005 || true
          supabase migration repair --status reverted 20241223000001 || true
          supabase migration repair --status reverted 20241223000002 || true
          supabase migration repair --status reverted 20241223000003 || true
          supabase migration repair --status reverted 20241231000001 || true
          supabase migration repair --status reverted 20241231000002 || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
